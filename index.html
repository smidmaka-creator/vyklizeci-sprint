<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vyklízecí sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
  :root{
    --wrap:#EEF5F0;
    --ground:#FAFAFA;
    --surface:#FFFFFF;
    --surface-2:#F0F5F2;
    --ink:#141414;
    --ink-soft:#4B5563;
    --ink-faint:#64748B;
    --line:#E2EBE5;
    --green:#1FA84F;
    --green-dark:#157A39;
    --green-soft:#E3F4E9;
    --green-ink:#0E5A2B;
    --salmon:#E8703F;
    --salmon-soft:#FDEBE3;
    --keep:#2B8BD6;   --keep-dark:#1E6AA8;
    --sell:#1FA84F;   --sell-dark:#157A39;
    --donate:#E0673A; --donate-dark:#B54D26;
    --trash:#DC3F44;  --trash-dark:#A82C31;
    --maybe:#64748B;  --maybe-dark:#475569;
    --accent:var(--green);
    --accent-dark:var(--green-dark);
    --on-accent:#FFFFFF;
    --on-h:#FFFFFF;
    --gold:#F2B233; --silver:#A7B0BA; --bronze:#C98A55;
    --shadow-card:0 25px 50px -12px rgba(31,168,79,.22),0 2px 6px rgba(20,20,20,.06);
    --shadow-soft:0 4px 14px -2px rgba(31,168,79,.10);
    --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --wrap:#0A100D; --ground:#0F1613; --surface:#17201B; --surface-2:#1F2B25;
      --ink:#F1F5F2; --ink-soft:#C3CDC7; --ink-faint:#94A39B; --line:#293A31;
      --green:#2ECC6A; --green-dark:#1E9C4F; --green-soft:#173A26; --green-ink:#9CE9B8;
      --salmon:#F79573; --salmon-soft:#3B241B;
      --keep:#5AB0F0; --keep-dark:#2F84C4; --sell:#2ECC6A; --sell-dark:#1E9C4F;
      --donate:#F79573; --donate-dark:#C86A4B; --trash:#F26262; --trash-dark:#BE3D3D;
      --maybe:#8A9AA8; --maybe-dark:#5F6F7D;
      --on-accent:#0B2E18; --on-h:#0F1613;
      --gold:#F5C24D; --silver:#BCC5CE; --bronze:#D9A06B;
      --shadow-card:0 25px 50px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
      --shadow-soft:0 4px 14px -2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --wrap:#0A100D; --ground:#0F1613; --surface:#17201B; --surface-2:#1F2B25;
    --ink:#F1F5F2; --ink-soft:#C3CDC7; --ink-faint:#94A39B; --line:#293A31;
    --green:#2ECC6A; --green-dark:#1E9C4F; --green-soft:#173A26; --green-ink:#9CE9B8;
    --salmon:#F79573; --salmon-soft:#3B241B;
    --keep:#5AB0F0; --keep-dark:#2F84C4; --sell:#2ECC6A; --sell-dark:#1E9C4F;
    --donate:#F79573; --donate-dark:#C86A4B; --trash:#F26262; --trash-dark:#BE3D3D;
    --maybe:#8A9AA8; --maybe-dark:#5F6F7D;
    --on-accent:#0B2E18; --on-h:#0F1613;
    --gold:#F5C24D; --silver:#BCC5CE; --bronze:#D9A06B;
    --shadow-card:0 25px 50px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
    --shadow-soft:0 4px 14px -2px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--wrap);color:var(--ink);font-family:var(--font);font-weight:500;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;color:inherit;font-weight:inherit}
  .ic{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.12em}
  .num{font-variant-numeric:tabular-nums;font-weight:800}

  .shell{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;
    background:var(--ground);position:relative;overflow:hidden}
  @media (min-width:560px){
    body{padding:22px 16px}
    .shell{height:calc(100dvh - 44px);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow-card)}
  }

  /* ---- chunky pressable button (Duolingo-style edge) ---- */
  .press{--edge:var(--accent-dark);border:0;cursor:pointer;position:relative;
    box-shadow:0 5px 0 var(--edge);transform:translateY(0);transition:transform .06s,box-shadow .06s}
  .press:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge)}

  /* ---- topbar ---- */
  .topbar{flex:0 0 auto;padding:14px 16px 12px;background:var(--ground);z-index:5}
  .topbar__row{display:flex;align-items:center;gap:8px}
  .wordmark{font-weight:900;font-size:17px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;flex:1;min-width:0;color:var(--ink)}
  .wordmark em{font-style:normal;color:var(--green)}
  .wordmark .ic{color:var(--green);font-size:18px;stroke-width:2.2}
  .iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:0;
    background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:18px}
  .iconbtn .ic{stroke-width:2.2}
  .iconbtn:hover{background:var(--green-soft);color:var(--green-ink)}

  .statrow{display:flex;align-items:center;gap:8px;margin-top:12px}
  .pchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;
    background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .pchip .av{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--green);
    color:var(--on-accent);font-size:11px;font-weight:800}
  .pchip .car{color:var(--ink-faint);font-size:10px}
  .sticker{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-weight:800;font-size:12.5px;
    background:var(--salmon-soft);color:var(--salmon);transform:rotate(-3deg)}
  .sticker .ic{stroke-width:2.4}
  .sticker.dead{background:var(--surface-2);color:var(--ink-faint)}
  .xp{flex:1;min-width:0}
  .xp__meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:4px}
  .xp__meta b{color:var(--ink)}
  .xp__bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:2px solid var(--line)}
  .xp__fill{height:100%;border-radius:999px;background:var(--green);transition:width .45s cubic-bezier(.2,.8,.2,1);
    background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.25))}

  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .dock{flex:0 0 auto;padding:12px 16px 18px;display:flex;gap:10px;
    background:linear-gradient(to top,var(--ground) 70%,transparent)}

  .demobanner{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 16px 0;
    padding:9px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--green-ink);background:var(--green-soft)}
  .demobanner button{background:none;border:0;color:var(--green-ink);font-weight:800;font-size:12px;cursor:pointer;padding:0;white-space:nowrap;text-decoration:underline}

  /* ---- card stage ---- */
  .stage{position:relative;display:grid;place-items:center;padding:20px 16px 4px;min-height:372px;isolation:isolate}
  .blob{position:absolute;width:min(380px,92vw);height:300px;top:24px;left:50%;transform:translateX(-50%) rotate(-6deg);
    background:var(--green-soft);border-radius:63% 37% 54% 46% / 55% 48% 52% 45%;z-index:-1}
  .blob::after{content:"";position:absolute;right:-18px;bottom:-14px;width:110px;height:110px;background:var(--salmon-soft);
    border-radius:44% 56% 62% 38% / 52% 41% 59% 48%;transform:rotate(18deg)}
  .cardstack{position:relative;width:min(344px,80vw);height:344px}
  .card{position:absolute;inset:0;background:var(--surface);border-radius:28px;
    box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column}
  .card--top{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform}
  .card--top:active{cursor:grabbing}
  .card--behind{transform:scale(.94) translateY(18px);pointer-events:none;opacity:.85}
  .card__photo{flex:1;position:relative;display:grid;place-items:center;color:var(--green);
    background:linear-gradient(160deg,var(--green-soft),color-mix(in srgb,var(--green-soft) 50%,var(--surface)))}
  .card__photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bigic{font-size:84px;line-height:1;opacity:.5}
  .bigic .ic{stroke-width:1.4}
  .price{position:absolute;left:14px;bottom:12px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--ground);
    font-weight:800;font-size:13px;transform:rotate(-2deg);box-shadow:0 4px 12px rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:6px}
  .price .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
  .card__body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
  .card__name{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
    color:var(--ink-soft);font-weight:700;font-size:11px}
  .advice{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.35}

  .stamp{position:absolute;top:18px;padding:5px 12px;border:4px solid;border-radius:12px;
    font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .1s;background:var(--surface)}
  .stamp[data-dir="keep"]{left:16px;transform:rotate(-11deg);color:var(--keep);border-color:var(--keep)}
  .stamp[data-dir="sell"]{right:16px;transform:rotate(11deg);color:var(--sell);border-color:var(--sell)}
  .stamp[data-dir="trash"]{left:16px;top:96px;transform:rotate(-9deg);color:var(--trash);border-color:var(--trash)}
  .stamp[data-dir="donate"]{right:16px;top:96px;transform:rotate(9deg);color:var(--donate);border-color:var(--donate)}

  .hint{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-faint);padding:0 8px}

  /* ---- decisions ---- */
  .decisions{width:min(344px,80vw);margin:32px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dbtn{--h:var(--keep);--edge:var(--keep-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:12px 8px 11px;min-height:66px;border-radius:20px;font-weight:800;font-size:15px;letter-spacing:-.01em;
    background:var(--h);color:var(--on-h)}
  .dbtn .ic{font-size:20px;stroke-width:2.4;margin-bottom:2px}
  .dbtn small{font-weight:700;font-size:10.5px;opacity:.85}
  .subrow{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .linkbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
    border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer}
  .linkbtn:hover{border-color:var(--green);color:var(--green-ink)}
  .linkbtn .ic{font-size:14px;stroke-width:2.2}

  /* ---- piles / board ---- */
  .sec{padding:22px 16px 0}
  .sec h2{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:0 0 10px}
  .pilerow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pile{--h:var(--keep);display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 6px 10px;
    border-radius:20px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:center}
  .pile:hover{border-color:var(--h)}
  .pile b{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--h);color:var(--on-h);
    font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .pile span{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .yearbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:12px 16px;
    border-radius:20px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:left}
  .yearbox.warn{background:var(--salmon-soft);border-color:transparent}
  .yearbox .t{font-size:13px;font-weight:800;display:block}
  .yearbox .s{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
  .yearbox.warn .s{color:var(--salmon)}
  .yearbox .go{width:30px;height:30px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);font-weight:800;flex:0 0 auto}
  .yearbox.warn .go{background:var(--salmon);color:#fff}

  .board{display:flex;flex-direction:column;gap:8px}
  .brow{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
  .brow .av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
  .brow .nm{flex:1;font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow.me{border-color:var(--green)}
  .brow .xpv{font-weight:800;font-size:13px;color:var(--green-ink);background:var(--green-soft);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}

  .emptystate{text-align:center;padding:44px 24px 12px;color:var(--ink-soft)}
  .emptystate .big{width:84px;height:84px;margin:0 auto;border-radius:999px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;
    box-shadow:0 6px 0 var(--green-dark)}
  .emptystate .big .ic{stroke-width:2.6}
  .emptystate h3{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:18px 0 6px;color:var(--ink)}
  .emptystate p{font-size:13.5px;font-weight:600;margin:0}

  .btn{border:0;border-radius:999px;padding:15px 18px;font-weight:800;font-size:16px;letter-spacing:-.01em;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn--primary{background:var(--ink);color:var(--ground);flex:1;--edge:#000}
  .btn--ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink);padding-top:13px;padding-bottom:13px}
  .btn--accent{background:var(--green);color:var(--on-accent);flex:1;--edge:var(--green-dark)}
  .btn .ic{font-size:18px;stroke-width:2.4}
  .btn--round{width:54px;height:54px;padding:0;border-radius:999px;flex:0 0 auto}

  .sprintbar{flex:1;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:999px;background:var(--green);color:var(--on-accent);
    box-shadow:0 5px 0 var(--green-dark)}
  .sprintbar .ic{font-size:20px;stroke-width:2.4}
  .sprintbar .clock{font-weight:900;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sprintbar .z{flex:1;min-width:0;font-size:12px;font-weight:700;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sprintbar button{background:color-mix(in srgb,var(--on-accent) 16%,transparent);border:2px solid color-mix(in srgb,var(--on-accent) 45%,transparent);
    color:var(--on-accent);border-radius:999px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer}

  /* ---- sheets ---- */
  .overlay{position:fixed;inset:0;background:rgba(10,16,13,.5);display:flex;align-items:flex-end;justify-content:center;
    z-index:40;padding:0;animation:fade .18s ease}
  @media (min-width:560px){.overlay{align-items:center;padding:20px}}
  @keyframes fade{from{opacity:0}}
  .sheet{width:min(468px,100%);max-height:88dvh;overflow-y:auto;background:var(--surface);
    border-radius:30px 30px 0 0;padding:14px 18px 24px;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:560px){.sheet{border-radius:28px}}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}}
  .sheet__grip{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
  .sheet h3{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
  .sheet .sub{color:var(--ink-soft);font-size:13px;font-weight:600;margin:0 0 16px;line-height:1.4}
  .field{margin-bottom:14px}
  .field>label{display:block;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:7px}
  .input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);
    color:var(--ink);font-size:15px;font-weight:600;font-family:var(--font)}
  .input::placeholder{color:var(--ink-faint);font-weight:500}
  .input:focus{outline:0;border-color:var(--green)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:var(--surface);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--green);color:var(--on-accent);border-color:var(--green)}
  .chip .ic{font-size:14px;stroke-width:2.2}
  .segment{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--surface-2);border-radius:999px}
  .seg{padding:9px 6px;border:0;border-radius:999px;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer}
  .seg[aria-pressed="true"]{background:var(--surface);color:var(--green-ink);box-shadow:var(--shadow-soft)}
  .photopick{height:140px;border:2px dashed var(--line);border-radius:20px;display:grid;place-items:center;
    color:var(--ink-faint);cursor:pointer;overflow:hidden;position:relative;text-align:center;font-size:13px;font-weight:700;gap:4px;background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 40%,transparent);color:var(--green-ink)}
  .photopick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photopick .ic{font-size:26px;stroke-width:2}
  .sheet__actions{display:flex;gap:10px;margin-top:8px}
  .sheet__actions .btn{flex:1;font-size:15px;padding:14px}

  .list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .li{display:flex;align-items:center;gap:12px;padding:10px;border:2px solid var(--line);border-radius:20px;background:var(--surface)}
  .li__ph{width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;
    flex:0 0 auto;color:var(--green);font-size:20px;overflow:hidden}
  .li__ph .ic{stroke-width:2}
  .li__ph img{width:100%;height:100%;object-fit:cover}
  .li__t{flex:1;min-width:0}
  .li__n{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li__s{font-size:11.5px;font-weight:600;color:var(--ink-faint)}
  .li__b{background:var(--surface-2);border:0;border-radius:999px;padding:7px 11px;font-size:12px;
    font-weight:800;cursor:pointer;color:var(--ink);white-space:nowrap}
  .li__b:hover{background:var(--green-soft);color:var(--green-ink)}
  .li .num{font-size:18px;color:var(--ink)}
  .empty-note{color:var(--ink-faint);font-size:13px;font-weight:600;text-align:center;padding:16px 0}
  .settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);font-size:13.5px;font-weight:700}
  .settings-row:last-child{border-bottom:0}
  .settings-row button{background:var(--surface-2);border:0;border-radius:999px;padding:8px 13px;
    font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
  .settings-row button:disabled{opacity:.4;cursor:default}
  .settings-row button.danger{color:var(--trash);background:color-mix(in srgb,var(--trash) 12%,var(--surface))}

  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;animation:rise .2s ease}
  .toast button{background:none;border:0;color:var(--green);font-weight:800;cursor:pointer;font-size:13px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  :focus-visible{outline:3px solid var(--green);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<div class="shell">
  <div class="topbar" id="topbar"></div>
  <div class="scroll" id="scroll"></div>
  <div class="dock" id="dock"></div>
</div>
<div id="modal-root"></div>

<script>
(() => {
  "use strict";
  const KEY = "vyklizeci-sprint-v1";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DAY = 86400000;
  const $ = (s, r=document) => r.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const midnight = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  const kc = n => Math.round(n).toLocaleString("cs-CZ") + " Kč";
  const kcR = (a, b) => Math.round(a).toLocaleString("cs-CZ") + "–" + Math.round(b).toLocaleString("cs-CZ") + " Kč";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const plural = (n, a) => a[n === 1 ? 0 : (n >= 2 && n <= 4 ? 1 : 2)];
  const nVeci = n => n + " " + plural(n, ["věc", "věci", "věcí"]);

  /* ---------- icons ---------- */
  const P = {
    shirt:'<path d="M8 3l1.6 2A3 3 0 0 0 15 5L16.5 3 21 6l-2.5 4L16 8.6V21H8V8.6L5.5 10 3 6z"/>',
    toy:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="8.5" y="13.5" width="7" height="7" rx="1"/>',
    plug:'<path d="M9 3v4M15 3v4M6 7h12v3a6 6 0 0 1-12 0zM12 16v5"/>',
    book:'<path d="M6 3h10a1 1 0 0 1 1 1v15H8a2 2 0 0 0-2 2V4a1 1 0 0 1 1-1zM6 19a2 2 0 0 0 2 2h9"/>',
    cup:'<path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h1.5a2.5 2.5 0 0 1 0 5H17M7 3v2M11 3v2"/>',
    vase:'<path d="M8 3h8l-1.2 3.8A6 6 0 0 1 18 12c0 4.5-3 9-6 9s-6-4.5-6-9a6 6 0 0 1 3.2-5.2z"/>',
    chair:'<path d="M7 3v8M17 3v8M5 11h14M6 11l1.2 6M18 11l-1.2 6M8.5 21l.8-4M15.5 21l-.8-4"/>',
    ball:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3 3.5 15 0 18M12 3c-3.5 3-3.5 15 0 18"/>',
    box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
    home:'<path d="M4 11l8-7 8 7M6 10v10h12V10"/>',
    tag:'<path d="M4 4h7l9 9-7 7-9-9zM8 8h.01"/>',
    gift:'<path d="M4 9h16v11H4zM4 9l2-5c1.6-.6 3.4 0 4 1.6L12 9M20 9l-2-5c-1.6-.6-3.4 0-4 1.6L12 9M12 9v11"/>',
    bin:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M3 12h2M19 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/>',
    flame:'<path d="M12 3c1 3-2 4-2 7a3 3 0 0 0 6 .3C16 6 12 6 12 3zM8.5 11c-.6 1-1 2.2-1 3.5a4.5 4.5 0 0 0 9 0c0-1-.2-1.8-.5-2.5"/>',
    leaf:'<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7"/>',
    check:'<path d="M4 12l5 5L20 6"/>',
    bolt:'<path d="M13 3L4 14h7l-1 7 9-11h-7z"/>',
    photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-4-9 7"/>',
    undo:'<path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3"/>',
    skip:'<path d="M5 5l9 7-9 7zM19 5v14"/>',
  };
  const ic = (n, cls="") => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||""}</svg>`;

  /* ---------- domain ---------- */
  const CATS = [
    {id:"obleceni-damske", label:"Oblečení – dámské", short:"Dámské obl.", icon:"shirt", base:190},
    {id:"obleceni-panske", label:"Oblečení – pánské", short:"Pánské obl.", icon:"shirt", base:160},
    {id:"obleceni-detske", label:"Oblečení – dětské", short:"Dětské obl.", icon:"shirt", base:80},
    {id:"hracka",          label:"Hračka",            short:"Hračka",     icon:"toy",   base:150},
    {id:"elektronika",     label:"Elektronika",       short:"Elektro",    icon:"plug",  base:520},
    {id:"kniha",           label:"Kniha",             short:"Kniha",      icon:"book",  base:55},
    {id:"nadobi",          label:"Nádobí",            short:"Nádobí",     icon:"cup",   base:110},
    {id:"dekorace",        label:"Dekorace",          short:"Dekorace",   icon:"vase",  base:95},
    {id:"nabytek",         label:"Nábytek",           short:"Nábytek",    icon:"chair", base:750},
    {id:"sport",           label:"Sport & hobby",     short:"Sport",      icon:"ball",  base:300},
    {id:"jine",            label:"Jiné",              short:"Jiné",       icon:"box",   base:120},
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const CONDS = [
    {id:"jako-nove",  label:"Jako nové",  mult:1.3},
    {id:"dobre",      label:"Dobrý stav", mult:1.0},
    {id:"opotrebene", label:"Opotřebené", mult:0.5},
  ];
  const COND = Object.fromEntries(CONDS.map(c => [c.id, c]));
  const DEC = {
    keep:   {label:"Nechat",  verb:"Zůstává doma",             icon:"home",  cvar:"--keep"},
    sell:   {label:"Prodat",  verb:"Putuje na prodej",          icon:"tag",   cvar:"--sell"},
    donate: {label:"Darovat", verb:"Jde darovat",               icon:"gift",  cvar:"--donate"},
    trash:  {label:"Vyhodit", verb:"Míří do tříděného odpadu",   icon:"bin",   cvar:"--trash"},
    maybe:  {label:"Krabice na rok", verb:"Uloženo do krabice na rok", icon:"clock", cvar:"--maybe"},
  };
  const LEVELS = [
    {min:0,name:"Nováček"},{min:150,name:"Vyklízeč"},{min:400,name:"Uklizeno"},
    {min:850,name:"Minimalista"},{min:1500,name:"Mistr prostoru"},
  ];
  const ZONES = ["Skříň","Dětský pokoj","Kuchyň","Koupelna","Chodba","Sklep / komora","Celý byt"];
  const AV_COLORS = ["var(--green)","var(--salmon)","var(--keep)","var(--gold)","var(--maybe)"];

  function estimate(catId, condId){
    const c = CAT[catId] || CAT.jine;
    const k = (COND[condId] || COND.dobre).mult;
    const mid = Math.round(c.base * k);
    const lo = Math.max(0, Math.round(mid * 0.6 / 10) * 10);
    const hi = Math.round(mid * 1.45 / 10) * 10;
    let advice, channel;
    const softCats = ["kniha","obleceni-detske","nadobi","dekorace","obleceni-panske","obleceni-damske","hracka"];
    if (condId === "opotrebene" && catId === "elektronika") { advice = "Ověř, že funguje. Nefunkční → sběrný dvůr."; channel = "trash"; }
    else if (condId === "opotrebene" && softCats.includes(catId)) { advice = "Na prodej se čas nevyplatí — darovat."; channel = "donate"; }
    else if (mid < 110) { advice = "Výtěžek nepokryje focení a balení — darovat."; channel = "donate"; }
    else if (mid <= 400) { advice = "Vyplatí se na Vinted nebo Bazoš."; channel = "sell"; }
    else { advice = "Vyšší hodnota — zkus Bazoš / Marketplace."; channel = "sell"; }
    return {lo, hi, mid, advice, channel};
  }

  /* ---------- state ---------- */
  function seed(){
    const p1 = uid(), p2 = uid(), p3 = uid();
    const mk = (name, cat, cond, decision, extra={}) => ({
      id: uid(), name, cat, cond, photo: null, note: "",
      decision: decision || null, createdAt: Date.now(),
      decidedAt: decision ? Date.now() : null, decidedBy: decision ? p1 : null,
      example: true, ...extra,
    });
    return {
      v: 1, example: true,
      players: [
        {id:p1, name:"Ty",   xp:120, example:true},
        {id:p2, name:"Míša", xp:90,  example:true},
        {id:p3, name:"Péťa", xp:45,  example:true},
      ],
      currentPlayer: p1,
      streak: {count: 2, last: midnight() - DAY},
      seenHint: false,
      sprint: null,
      sprintsDone: 3,
      items: [
        mk("Dětská softshellová bunda, vel. 104", "obleceni-detske", "dobre", null),
        mk("Kávovar Krups Dolce Gusto", "elektronika", "dobre", null),
        mk("LEGO Technic 42100 (nekompletní)", "hracka", "opotrebene", null),
        mk("Dámské džíny Levi's 501, vel. 30", "obleceni-damske", "jako-nove", "sell"),
        mk("Plyšový medvěd", "hracka", "dobre", "donate"),
        mk("Sada 6 hrnků IKEA", "nadobi", "dobre", "donate"),
        mk("Stolní ventilátor (nefunkční)", "elektronika", "opotrebene", "trash"),
        mk("Štos detektivek (8 ks)", "kniha", "dobre", "maybe", {reviewAt: midnight() - 40*DAY}),
      ],
    };
  }
  function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Došlo místo v prohlížeči — vymaž rozhodnuté věci."); } }
  let S = load() || seed();
  if (S.sprint && S.sprint.endsAt <= Date.now()) S.sprint = null;

  let lastAction = null;
  let sprintTimer = null;
  let animating = false;
  let curPileKey = null;

  /* ---------- helpers ---------- */
  const pending = () => S.items.filter(i => !i.decision);
  const curP = () => S.players.find(p => p.id === S.currentPlayer) || S.players[0];
  const countBy = d => S.items.filter(i => i.decision === d).length;
  const initials = n => (n.trim()[0] || "?").toUpperCase();
  const avColor = p => AV_COLORS[Math.max(0, S.players.findIndex(x => x.id === p.id)) % AV_COLORS.length];
  function levelOf(xp){
    let i = 0;
    LEVELS.forEach((l, idx) => { if (xp >= l.min) i = idx; });
    const next = LEVELS[i+1];
    return { idx:i, name:LEVELS[i].name, into:xp - LEVELS[i].min,
             span: next ? next.min - LEVELS[i].min : null, toNext: next ? next.min - xp : null };
  }
  function streakAlive(){ return S.streak.last >= midnight() - DAY; }
  function touchStreak(){
    const t = midnight();
    if (S.streak.last === t) return;
    S.streak.count = (S.streak.last === t - DAY) ? S.streak.count + 1 : 1;
    S.streak.last = t;
  }

  /* ---------- render ---------- */
  function render(){
    renderTopbar();
    renderScroll();
    renderDock();
    save();
  }

  function renderTopbar(){
    const p = curP(), lv = levelOf(p.xp);
    const fill = lv.span ? Math.min(100, Math.round(lv.into / lv.span * 100)) : 100;
    const alive = streakAlive();
    $("#topbar").innerHTML = `
      <div class="topbar__row">
        <div class="wordmark">${ic("leaf")} Vyklízecí <em>sprint</em></div>
        <button class="iconbtn" data-act="add" aria-label="Přidat věc">${ic("plus")}</button>
        <button class="iconbtn" data-act="settings" aria-label="Nastavení">${ic("gear")}</button>
      </div>
      <div class="statrow">
        <button class="pchip" data-act="players">
          <span class="av" style="background:${avColor(p)}">${esc(initials(p.name))}</span>${esc(p.name)} <span class="car">▾</span>
        </button>
        <span class="sticker ${alive?"":"dead"}" title="Série dní v řadě">${ic("flame")}${alive?S.streak.count:0}</span>
        <span class="xp">
          <span class="xp__meta"><b>${esc(lv.name)}</b><span>${lv.toNext!=null?("ještě "+lv.toNext+" XP"):"MAX"}</span></span>
          <span class="xp__bar"><span class="xp__fill" style="width:${fill}%"></span></span>
        </span>
      </div>`;
  }

  function cardMarkup(it, top){
    const c = CAT[it.cat] || CAT.jine;
    const e = estimate(it.cat, it.cond);
    const photo = it.photo
      ? `<img src="${it.photo}" alt="">`
      : `<span class="bigic">${ic(c.icon)}</span>`;
    const stamps = top ? `
      <div class="stamp" data-dir="keep">Nechat</div>
      <div class="stamp" data-dir="sell">Prodat</div>
      <div class="stamp" data-dir="trash">Vyhodit</div>
      <div class="stamp" data-dir="donate">Darovat</div>` : "";
    return `<article class="card ${top?"card--top":"card--behind"}" ${top?'tabindex="0" aria-label="Karta věci: '+esc(it.name)+'"':""}>
      <div class="card__photo">${photo}
        <span class="price"><span class="dot" style="background:var(${DEC[e.channel].cvar})"></span>${kcR(e.lo, e.hi)}</span>
        ${stamps}
      </div>
      <div class="card__body">
        <div class="card__name">${esc(it.name)}</div>
        <div class="tags">
          <span class="tag">${ic(c.icon)}${esc(c.short)}</span>
          <span class="tag">${esc((COND[it.cond]||COND.dobre).label)}</span>
        </div>
        <div class="advice">${esc(e.advice)}</div>
      </div>
    </article>`;
  }

  function stageMarkup(){
    const pend = pending();
    if (!pend.length){
      return `<div class="emptystate">
        <div class="big">${ic("check")}</div>
        <h3>Stack je prázdný!</h3>
        <p>Každá věc má jasno. Přidej další, nebo si dej vyklízecí sprint.</p>
      </div>`;
    }
    const cards = [];
    if (pend[1]) cards.push(cardMarkup(pend[1], false));
    cards.push(cardMarkup(pend[0], true));
    const hint = !S.seenHint ? `<div class="hint">Táhni kartu do stran, nebo ťukni na volbu níž</div>` : "";
    return `<div class="stage"><div class="blob"></div><div class="cardstack">${cards.join("")}${hint}</div></div>
      <div class="decisions">
        <button class="dbtn press" style="--h:var(--keep);--edge:var(--keep-dark)"     data-decide="keep">${ic("home")}Nechat<small>${nVeci(countBy("keep"))}</small></button>
        <button class="dbtn press" style="--h:var(--sell);--edge:var(--sell-dark)"     data-decide="sell">${ic("tag")}Prodat<small>${nVeci(countBy("sell"))}</small></button>
        <button class="dbtn press" style="--h:var(--donate);--edge:var(--donate-dark)" data-decide="donate">${ic("gift")}Darovat<small>${nVeci(countBy("donate"))}</small></button>
        <button class="dbtn press" style="--h:var(--trash);--edge:var(--trash-dark)"   data-decide="trash">${ic("bin")}Vyhodit<small>${nVeci(countBy("trash"))}</small></button>
      </div>
      <div class="subrow">
        <button class="linkbtn" data-decide="maybe">${ic("clock")}Do krabice na rok</button>
        <button class="linkbtn" data-act="skip">${ic("skip")}Přeskočit</button>
      </div>`;
  }

  function pilesMarkup(){
    const rows = [["keep","Nechat"],["sell","Prodat"],["donate","Darovat"],["trash","Vyhodit"]]
      .map(([k,l]) => `<button class="pile" style="--h:var(${DEC[k].cvar})" data-pile="${k}">
        <b>${countBy(k)}</b><span>${l}</span></button>`).join("");
    const maybeItems = S.items.filter(i => i.decision === "maybe");
    let year = "";
    if (maybeItems.length){
      const overdue = maybeItems.filter(i => i.reviewAt && i.reviewAt < Date.now()).length;
      year = `<button class="yearbox ${overdue?"warn":""}" data-pile="maybe">
        <span>
          <span class="t">Krabice na rok · ${nVeci(maybeItems.length)}</span>
          <span class="s">${overdue ? overdue+" čeká moc dlouho — čas rozhodnout" : "Připomene se, až uplyne půl roku"}</span>
        </span><span class="go">→</span></button>`;
    }
    return `<div class="sec"><h2>Rozhodnuto</h2><div class="pilerow">${rows}</div>${year}</div>`;
  }

  function boardMarkup(){
    const ranked = [...S.players].sort((a,b) => b.xp - a.xp);
    return `<div class="sec"><h2>Rodinný žebříček</h2><div class="board">${
      ranked.map((p,i) => `<div class="brow ${p.id===S.currentPlayer?"me":""}">
        <span class="av" style="background:${avColor(p)}">${i<3 ? ["🥇","🥈","🥉"][i] : esc(initials(p.name))}</span>
        <span class="nm">${esc(p.name)}</span>
        <span class="xpv">${p.xp} XP</span></div>`).join("")
    }</div></div>`;
  }

  function renderScroll(){
    const banner = S.example
      ? `<div class="demobanner"><span>Hraješ na ukázkových datech.</span><button data-act="settings">Vymazat</button></div>`
      : "";
    $("#scroll").innerHTML = banner + stageMarkup() + pilesMarkup() + boardMarkup() + `<div style="height:12px"></div>`;
    wireCard();
  }

  function renderDock(){
    const dock = $("#dock");
    if (S.sprint){
      dock.innerHTML = `<div class="sprintbar">
        ${ic("bolt")}
        <span class="clock">${fmtLeft()}</span>
        <span class="z">${esc(S.sprint.zone)} · vyřešeno ${S.sprint.resolved}</span>
        <button data-act="endsprint">Konec</button>
      </div>`;
    } else if (pending().length){
      dock.innerHTML = `
        <button class="btn btn--accent press" data-act="sprint">${ic("bolt")}Spustit sprint</button>
        <button class="btn btn--ghost btn--round" data-act="add" aria-label="Přidat věc">${ic("plus")}</button>`;
    } else {
      dock.innerHTML = `
        <button class="btn btn--accent press" data-act="add">${ic("plus")}Přidat věc</button>
        <button class="btn btn--ghost" data-act="sprint">${ic("bolt")}Sprint</button>`;
    }
  }

  /* ---------- card interaction ---------- */
  function wireCard(){
    const card = $(".card--top");
    if (!card) return;
    const stamps = card.querySelectorAll(".stamp");
    let sx=0, sy=0, dx=0, dy=0, dragging=false;
    const dirOf = () => Math.abs(dx) > Math.abs(dy) ? (dx>0?"sell":"trash") : (dy>0?"donate":"keep");
    const clearStamps = () => stamps.forEach(s => s.style.opacity = 0);

    card.addEventListener("pointerdown", e => {
      dragging = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      card.setPointerCapture(e.pointerId); card.style.transition = "none";
    });
    card.addEventListener("pointermove", e => {
      if (!dragging) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
      const d = dirOf(), dist = Math.hypot(dx, dy);
      stamps.forEach(s => s.style.opacity = s.dataset.dir === d ? Math.min(1, (dist-20)/80) : 0);
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      const d = dirOf(), dist = Math.hypot(dx, dy);
      if (dist > 92){ flyOut(card, d, dx, dy); }
      else { card.style.transition = "transform .26s cubic-bezier(.2,.8,.2,1)"; card.style.transform = ""; clearStamps(); }
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", () => { dragging = false; card.style.transition = "transform .2s"; card.style.transform = ""; clearStamps(); });

    card.addEventListener("keydown", e => {
      const map = {"1":"keep","2":"sell","3":"donate","4":"trash","5":"maybe",
        ArrowUp:"keep", ArrowRight:"sell", ArrowDown:"donate", ArrowLeft:"trash"};
      if (map[e.key]){ e.preventDefault(); e.stopPropagation(); pressDecide(map[e.key]); }
    });
  }

  function flyOut(card, decision, dx, dy){
    if (animating) return;
    animating = true;
    if (RM){ decide(decision); return; }
    const ux = dx || (decision==="sell"?1:decision==="trash"?-1:0);
    const uy = dy || (decision==="keep"?-1:decision==="donate"?1:0);
    const m = 760 / (Math.hypot(ux,uy) || 1);
    card.style.transition = "transform .34s ease-out, opacity .34s ease-out";
    card.style.transform = `translate(${ux*m}px,${uy*m}px) rotate(${(dx||ux*40)*0.08}deg)`;
    card.style.opacity = "0";
    let done = false;
    const go = () => { if (done) return; done = true; decide(decision); };
    card.addEventListener("transitionend", go, {once:true});
    setTimeout(go, 420);
  }

  function pressDecide(decision){
    if (animating) return;
    const card = $(".card--top");
    if (!card || RM){ decide(decision); return; }
    const v = {keep:[0,-1], sell:[1,0], donate:[0,1], trash:[-1,0], maybe:[0,1]}[decision] || [1,0];
    flyOut(card, decision, v[0]*120, v[1]*120);
  }

  function decide(decision){
    animating = false;
    const it = pending()[0];
    if (!it) return;
    const p = curP();
    const beforeLv = levelOf(p.xp).idx;
    it.decision = decision;
    it.decidedAt = Date.now();
    it.decidedBy = p.id;
    if (decision === "maybe" && !it.reviewAt) it.reviewAt = midnight() + 182*DAY;
    let gain = 10;
    if (S.sprint){ gain += 5; S.sprint.resolved += 1; }
    p.xp += gain;
    touchStreak();
    S.seenHint = true;
    lastAction = {itemId: it.id, playerId: p.id, gain};
    render();
    const leveled = levelOf(p.xp).idx > beforeLv;
    if (leveled){ confetti(); toast(`Level up · ${levelOf(p.xp).name}!`); }
    else toast(`${DEC[decision].verb} · +${gain} XP`, "Zpět", undoLast);
  }

  function undoLast(){
    if (!lastAction) return;
    const it = S.items.find(i => i.id === lastAction.itemId);
    if (it){ it.decision = null; it.decidedAt = null; it.decidedBy = null; }
    const p = S.players.find(x => x.id === lastAction.playerId);
    if (p) p.xp = Math.max(0, p.xp - lastAction.gain);
    if (S.sprint) S.sprint.resolved = Math.max(0, S.sprint.resolved - 1);
    lastAction = null;
    render();
  }

  /* ---------- sprint ---------- */
  function fmtLeft(){
    if (!S.sprint) return "0:00";
    const s = Math.max(0, Math.round((S.sprint.endsAt - Date.now()) / 1000));
    return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  }
  function startSprintTimer(){
    clearInterval(sprintTimer);
    sprintTimer = setInterval(() => {
      if (!S.sprint){ clearInterval(sprintTimer); return; }
      const clock = $("#dock .clock");
      if (clock) clock.textContent = fmtLeft();
      if (S.sprint.endsAt <= Date.now()) endSprint(false);
    }, 1000);
  }
  function beginSprint(zone, minutes){
    S.sprint = {zone, minutes, endsAt: Date.now() + minutes*60000, resolved: 0, startXp: curP().xp};
    closeSheet(); render(); startSprintTimer();
  }
  function endSprint(early){
    if (!S.sprint) return;
    const sp = S.sprint;
    const p = curP();
    let bonus = 0;
    if (sp.resolved > 0){ bonus = 25; p.xp += bonus; }
    const gained = p.xp - sp.startXp;
    S.sprint = null;
    S.sprintsDone = (S.sprintsDone||0) + (sp.resolved>0 ? 1 : 0);
    clearInterval(sprintTimer);
    render();
    if (sp.resolved > 0 && !RM) confetti();
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>${sp.resolved > 0 ? "Sprint hotový 💪" : "Sprint ukončen"}</h3>
      <p class="sub">${esc(sp.zone)} · ${sp.minutes} min</p>
      <div class="list">
        <div class="li"><span class="li__ph">${ic("check")}</span><div class="li__t"><div class="li__n">Vyřešeno kusů</div><div class="li__s">během sprintu</div></div><b class="num">${sp.resolved}</b></div>
        <div class="li"><span class="li__ph">${ic("bolt")}</span><div class="li__t"><div class="li__n">Získáno XP</div><div class="li__s">${bonus?("+"+bonus+" bonus za dokončení"):"bez bonusu"}</div></div><b class="num">+${gained}</b></div>
        <div class="li"><span class="li__ph">${ic("flame")}</span><div class="li__t"><div class="li__n">Série</div><div class="li__s">dní v řadě</div></div><b class="num">${streakAlive()?S.streak.count:0}</b></div>
      </div>
      <div class="sheet__actions"><button class="btn btn--accent press" data-act="close">Paráda</button></div>
    `);
  }

  /* ---------- sheets ---------- */
  const modalRoot = $("#modal-root");
  function openSheet(html){
    modalRoot.innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = $(".overlay", modalRoot);
    ov.addEventListener("pointerdown", e => { if (e.target === ov) closeSheet(); });
  }
  function closeSheet(){ modalRoot.innerHTML = ""; }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  function sheetAddItem(){
    const draft = {name:"", cat:"obleceni-detske", cond:"dobre", photo:null};
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>Přidat věc</h3>
      <p class="sub">Vyfoť ji nebo jen napiš — odhad ceny se dopočítá.</p>
      <div class="field">
        <label>Fotka (nepovinné)</label>
        <label class="photopick" id="pp">${ic("photo")}<span>Vyfotit / vybrat</span>
          <input type="file" accept="image/*" hidden id="pf"></label>
      </div>
      <div class="field"><label>Co to je</label>
        <input class="input" id="pn" placeholder="např. Dětská bunda vel. 104" autocomplete="off"></div>
      <div class="field"><label>Kategorie</label>
        <div class="chips" id="pc">${CATS.map(c => `<button type="button" class="chip" data-c="${c.id}" aria-pressed="${c.id===draft.cat}">${ic(c.icon)}${esc(c.short)}</button>`).join("")}</div></div>
      <div class="field"><label>Stav</label>
        <div class="segment" id="pcond">${CONDS.map(c => `<button type="button" class="seg" data-k="${c.id}" aria-pressed="${c.id===draft.cond}">${esc(c.label)}</button>`).join("")}</div></div>
      <div class="field"><label>Odhad</label><div class="advice" id="pest"></div></div>
      <div class="sheet__actions">
        <button class="btn btn--ghost" data-act="close">Zrušit</button>
        <button class="btn btn--accent press" id="padd">Přidat do stacku</button>
      </div>
    `);
    const estBox = $("#pest");
    const refreshEst = () => {
      const e = estimate(draft.cat, draft.cond);
      estBox.innerHTML = `<b style="color:var(${DEC[e.channel].cvar})">${kcR(e.lo, e.hi)}</b> · ${esc(e.advice)}`;
    };
    refreshEst();
    $("#pn").addEventListener("input", e => draft.name = e.target.value);
    $("#pc").addEventListener("click", e => {
      const b = e.target.closest("[data-c]"); if (!b) return;
      draft.cat = b.dataset.c;
      $("#pc").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
      refreshEst();
    });
    $("#pcond").addEventListener("click", e => {
      const b = e.target.closest("[data-k]"); if (!b) return;
      draft.cond = b.dataset.k;
      $("#pcond").querySelectorAll(".seg").forEach(x => x.setAttribute("aria-pressed", x === b));
      refreshEst();
    });
    $("#pf").addEventListener("change", e => {
      const f = e.target.files[0]; if (!f) return;
      downscale(f, url => { draft.photo = url; $("#pp").innerHTML = `<img src="${url}" alt="">`; });
    });
    $("#padd").addEventListener("click", () => {
      const name = draft.name.trim();
      if (!name){ $("#pn").focus(); $("#pn").style.borderColor = "var(--trash)"; return; }
      S.items.unshift({
        id: uid(), name, cat: draft.cat, cond: draft.cond, photo: draft.photo, note: "",
        decision: null, createdAt: Date.now(), decidedAt: null, decidedBy: null,
      });
      closeSheet(); render();
      toast("Přidáno do stacku");
    });
  }

  function sheetPile(key){
    curPileKey = key;
    const items = S.items.filter(i => i.decision === key);
    const isMaybe = key === "maybe";
    const title = isMaybe ? "Krabice na rok" : DEC[key].label;
    let head = "";
    if (key === "sell"){
      const tot = items.reduce((a,i) => { const e = estimate(i.cat,i.cond); return {lo:a.lo+e.lo, hi:a.hi+e.hi}; }, {lo:0,hi:0});
      head = items.length ? `<p class="sub">Odhadovaný výtěžek celkem <b style="color:var(--green-ink)">${kcR(tot.lo, tot.hi)}</b>.</p>` : "";
    } else if (key === "donate"){
      head = `<p class="sub">Textil → kontejner Diakonie / charita. Hračky a knihy → místní sbírka nebo Knihobudka.</p>`;
    } else if (key === "trash"){
      head = `<p class="sub">Textil patří do kontejneru na textil, elektro do sběrného dvora — ne do směsného.</p>`;
    } else if (isMaybe){
      head = `<p class="sub">Co se za půl roku ani nehne, to nejspíš nepotřebuješ.</p>`;
    }
    const rows = items.map(i => {
      const c = CAT[i.cat] || CAT.jine;
      const e = estimate(i.cat, i.cond);
      let sub = key === "sell" ? kcR(e.lo, e.hi) : c.short;
      let action = `<button class="li__b" data-return="${i.id}">Zpět do stacku</button>`;
      if (isMaybe){
        const over = i.reviewAt && i.reviewAt < Date.now();
        sub = over ? "leží tu už " + Math.round((Date.now()-(i.reviewAt-182*DAY))/DAY) + " dní" : "připomene se " + new Date(i.reviewAt).toLocaleDateString("cs-CZ");
        action = `<button class="li__b" data-move="donate:${i.id}" style="background:var(--salmon-soft);color:var(--salmon)">Darovat</button>`;
      }
      return `<div class="li">
        <span class="li__ph">${i.photo?`<img src="${i.photo}" alt="">`:ic(c.icon)}</span>
        <div class="li__t"><div class="li__n">${esc(i.name)}</div><div class="li__s">${esc(sub)}</div></div>
        ${action}</div>`;
    }).join("");
    const copyBtn = (key === "sell" || key === "donate") && items.length
      ? `<button class="btn btn--ghost" id="copylist">Zkopírovat seznam</button>` : "";
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>${esc(title)} · ${items.length}</h3>
      ${head}
      <div class="list">${rows || `<div class="empty-note">Zatím nic.</div>`}</div>
      <div class="sheet__actions">
        ${copyBtn}
        <button class="btn btn--primary" data-act="close">Hotovo</button>
      </div>
    `);
    $("#copylist") && $("#copylist").addEventListener("click", () => {
      const lines = items.map(i => {
        const e = estimate(i.cat, i.cond);
        return key === "sell" ? `• ${i.name} — ${kcR(e.lo, e.hi)}` : `• ${i.name}`;
      });
      const text = (key==="sell" ? "Na prodej:\n" : "K darování:\n") + lines.join("\n");
      navigator.clipboard?.writeText(text).then(() => toast("Zkopírováno")).catch(() => toast("Nepodařilo se zkopírovat"));
    });
  }

  function sheetSprint(){
    let zone = ZONES[0], mins = 15;
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>Vyklízecí sprint</h3>
      <p class="sub">Nastav si čas na jednu zónu a projdi co nejvíc věcí. Během sprintu je +5 XP navíc za kus.</p>
      <div class="field"><label>Zóna</label>
        <div class="chips" id="sz">${ZONES.map(z => `<button type="button" class="chip" data-z="${esc(z)}" aria-pressed="${z===zone}">${esc(z)}</button>`).join("")}</div></div>
      <div class="field"><label>Délka</label>
        <div class="segment" id="sm">${[10,15,25].map(m => `<button type="button" class="seg" data-m="${m}" aria-pressed="${m===mins}">${m} min</button>`).join("")}</div></div>
      <div class="sheet__actions">
        <button class="btn btn--ghost" data-act="close">Zrušit</button>
        <button class="btn btn--accent press" id="sgo">${ic("bolt")}Start</button>
      </div>
    `);
    $("#sz").addEventListener("click", e => { const b = e.target.closest("[data-z]"); if (!b) return; zone = b.dataset.z; $("#sz").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b)); });
    $("#sm").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; mins = +b.dataset.m; $("#sm").querySelectorAll(".seg").forEach(x => x.setAttribute("aria-pressed", x===b)); });
    $("#sgo").addEventListener("click", () => beginSprint(zone, mins));
  }

  function sheetPlayers(){
    const ranked = [...S.players].sort((a,b) => b.xp - a.xp);
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>Hráči</h3>
      <p class="sub">Přepni, kdo právě třídí. XP a série se počítají zvlášť.</p>
      <div class="list" id="plist">
        ${ranked.map(p => `<div class="li">
          <span class="li__ph" style="background:${avColor(p)};color:#fff;font-weight:800;border-radius:999px">${esc(initials(p.name))}</span>
          <div class="li__t"><div class="li__n">${esc(p.name)}${p.id===S.currentPlayer?" · právě hraje":""}</div><div class="li__s">${p.xp} XP · ${esc(levelOf(p.xp).name)}</div></div>
          ${p.id===S.currentPlayer ? "" : `<button class="li__b" data-pick="${p.id}">Hrát za</button>`}
          ${S.players.length>1 ? `<button class="li__b" data-del="${p.id}" style="color:var(--trash)">✕</button>` : ""}
        </div>`).join("")}
      </div>
      <div class="field" style="margin-top:12px"><label>Přidat hráče</label>
        <div style="display:flex;gap:8px">
          <input class="input" id="npn" placeholder="Jméno" autocomplete="off">
          <button class="btn btn--accent press" id="npadd" style="padding:10px 18px;font-size:14px">Přidat</button>
        </div>
      </div>
      <div class="sheet__actions"><button class="btn btn--primary" data-act="close">Hotovo</button></div>
    `);
    $("#plist").addEventListener("click", e => {
      const pick = e.target.closest("[data-pick]"), del = e.target.closest("[data-del]");
      if (pick){ S.currentPlayer = pick.dataset.pick; render(); sheetPlayers(); }
      if (del){
        S.players = S.players.filter(p => p.id !== del.dataset.del);
        if (S.currentPlayer === del.dataset.del) S.currentPlayer = S.players[0].id;
        render(); sheetPlayers();
      }
    });
    $("#npadd").addEventListener("click", () => {
      const n = $("#npn").value.trim(); if (!n) return;
      S.players.push({id: uid(), name: n, xp: 0});
      render(); sheetPlayers();
    });
  }

  function sheetSettings(){
    const stored = S.items.length;
    openSheet(`
      <div class="sheet__grip"></div>
      <h3>Nastavení</h3>
      <div class="settings-row"><span>Věcí v aplikaci</span><span class="num">${stored}</span></div>
      <div class="settings-row"><span>Dokončených sprintů</span><span class="num">${S.sprintsDone||0}</span></div>
      <div class="settings-row"><span>Ukázková data</span><button ${S.example?"":"disabled"} id="wipedemo">Vymazat ukázky</button></div>
      <div class="settings-row"><span>Začít úplně znovu</span><button class="danger" id="wipeall">Smazat vše</button></div>
      <p class="sub" style="margin-top:14px">Data zůstávají jen v tomhle prohlížeči (localStorage) a nikam se neodesílají. Fotky se před uložením zmenšují, ale i tak se jich vejde jen omezené množství — je to prototyp, ne archiv.</p>
      <div class="sheet__actions"><button class="btn btn--primary" data-act="close">Zavřít</button></div>
    `);
    $("#wipedemo").addEventListener("click", () => {
      S.items = S.items.filter(i => !i.example);
      S.players = S.players.filter(p => !p.example);
      if (!S.players.length) S.players = [{id: uid(), name: "Ty", xp: 0}];
      if (!S.players.find(p => p.id === S.currentPlayer)) S.currentPlayer = S.players[0].id;
      S.example = false;
      closeSheet(); render(); toast("Ukázky vymazány");
    });
    $("#wipeall").addEventListener("click", () => {
      try { localStorage.removeItem(KEY); } catch(e){}
      S = seed(); S.example = true;
      closeSheet(); render(); toast("Začínáme načisto");
    });
  }

  /* ---------- misc ---------- */
  function downscale(file, cb){
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 880, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        try { cb(cv.toDataURL("image/jpeg", 0.72)); } catch(e){ toast("Fotku se nepodařilo zpracovat"); }
      };
      img.onerror = () => toast("Nepodařilo se načíst fotku");
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  let toastT = null;
  function toast(msg, actionLabel, actionFn){
    clearTimeout(toastT);
    const old = $(".toast"); if (old) old.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span>${esc(msg)}</span>`;
    if (actionLabel){
      const b = document.createElement("button");
      b.textContent = actionLabel;
      b.onclick = () => { el.remove(); actionFn && actionFn(); };
      el.appendChild(b);
    }
    document.body.appendChild(el);
    toastT = setTimeout(() => el.remove(), 4500);
  }

  function confetti(){
    if (RM) return;
    const cv = document.createElement("canvas");
    cv.className = "confetti";
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    document.body.appendChild(cv);
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const cols = ["#1FA84F","#E8703F","#2B8BD6","#F2B233","#7ED9A0"];
    const N = 120;
    const parts = Array.from({length:N}, () => ({
      x: innerWidth/2 + (Math.random()-.5)*80,
      y: innerHeight/3,
      vx: (Math.random()-.5)*9,
      vy: Math.random()*-11 - 3,
      r: Math.random()*5 + 3,
      c: cols[(Math.random()*cols.length)|0],
      rot: Math.random()*6.28,
      vr: (Math.random()-.5)*0.4,
    }));
    const t0 = performance.now();
    (function frame(now){
      const dt = now - t0;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      parts.forEach(p => {
        p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= 0.99;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r*0.6, p.r*2, p.r*1.2);
        ctx.restore();
      });
      if (dt < 1500) requestAnimationFrame(frame);
      else cv.remove();
    })(t0);
  }

  /* ---------- global events ---------- */
  document.addEventListener("click", e => {
    const ret = e.target.closest("[data-return]");
    if (ret){
      const it = S.items.find(x => x.id === ret.dataset.return);
      if (it){ it.decision = null; it.decidedAt = null; it.decidedBy = null; }
      render(); if (curPileKey) sheetPile(curPileKey);
      return;
    }
    const mv = e.target.closest("[data-move]");
    if (mv){
      const [d, id] = mv.dataset.move.split(":");
      const it = S.items.find(x => x.id === id);
      if (it){ it.decision = d; it.decidedAt = Date.now(); it.decidedBy = S.currentPlayer; }
      render(); if (curPileKey) sheetPile(curPileKey);
      return;
    }
    const dec = e.target.closest("[data-decide]");
    if (dec){ pressDecide(dec.dataset.decide); return; }
    const pile = e.target.closest("[data-pile]");
    if (pile){ sheetPile(pile.dataset.pile); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const a = act.dataset.act;
    if (a === "add") sheetAddItem();
    else if (a === "sprint") sheetSprint();
    else if (a === "endsprint") endSprint(true);
    else if (a === "players") sheetPlayers();
    else if (a === "settings") sheetSettings();
    else if (a === "close") closeSheet();
    else if (a === "skip"){
      const it = pending()[0];
      if (it && pending().length > 1){ S.items = S.items.filter(x => x !== it).concat([it]); render(); }
    }
  });
  document.addEventListener("keydown", e => {
    if (modalRoot.innerHTML || document.activeElement?.classList.contains("input")) return;
    const map = {"1":"keep","2":"sell","3":"donate","4":"trash","5":"maybe"};
    if (map[e.key] && pending().length){ e.preventDefault(); pressDecide(map[e.key]); }
  });

  render();
  if (S.sprint) startSprintTimer();
})();
</script>
