<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1FA84F">
<title>Vyklízecí sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
  :root{
    --wrap:#EEF5F0;
    --ground:#FAFAFA;
    --surface:#FFFFFF;
    --surface-2:#F0F5F2;
    --ink:#141414;
    --ink-soft:#4B5563;
    --ink-faint:#64748B;
    --line:#E2EBE5;
    --green:#1FA84F;
    --green-dark:#157A39;
    --green-soft:#E3F4E9;
    --green-ink:#0E5A2B;
    --salmon:#E8703F;
    --salmon-soft:#FDEBE3;
    --keep:#2B8BD6;   --keep-dark:#1E6AA8;
    --sell:#1FA84F;   --sell-dark:#157A39;
    --donate:#E0673A; --donate-dark:#B54D26;
    --trash:#DC3F44;  --trash-dark:#A82C31;
    --maybe:#64748B;  --maybe-dark:#475569;
    --accent:var(--green);
    --accent-dark:var(--green-dark);
    --on-accent:#FFFFFF;
    --on-h:#FFFFFF;
    --gold:#F2B233; --silver:#A7B0BA; --bronze:#C98A55;
    --shadow-card:0 25px 50px -12px rgba(31,168,79,.22),0 2px 6px rgba(20,20,20,.06);
    --shadow-soft:0 4px 14px -2px rgba(31,168,79,.10);
    --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --wrap:#0A100D; --ground:#0F1613; --surface:#17201B; --surface-2:#1F2B25;
      --ink:#F1F5F2; --ink-soft:#C3CDC7; --ink-faint:#94A39B; --line:#293A31;
      --green:#2ECC6A; --green-dark:#1E9C4F; --green-soft:#173A26; --green-ink:#9CE9B8;
      --salmon:#F79573; --salmon-soft:#3B241B;
      --keep:#5AB0F0; --keep-dark:#2F84C4; --sell:#2ECC6A; --sell-dark:#1E9C4F;
      --donate:#F79573; --donate-dark:#C86A4B; --trash:#F26262; --trash-dark:#BE3D3D;
      --maybe:#8A9AA8; --maybe-dark:#5F6F7D;
      --on-accent:#0B2E18; --on-h:#0F1613;
      --gold:#F5C24D; --silver:#BCC5CE; --bronze:#D9A06B;
      --shadow-card:0 25px 50px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
      --shadow-soft:0 4px 14px -2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --wrap:#0A100D; --ground:#0F1613; --surface:#17201B; --surface-2:#1F2B25;
    --ink:#F1F5F2; --ink-soft:#C3CDC7; --ink-faint:#94A39B; --line:#293A31;
    --green:#2ECC6A; --green-dark:#1E9C4F; --green-soft:#173A26; --green-ink:#9CE9B8;
    --salmon:#F79573; --salmon-soft:#3B241B;
    --keep:#5AB0F0; --keep-dark:#2F84C4; --sell:#2ECC6A; --sell-dark:#1E9C4F;
    --donate:#F79573; --donate-dark:#C86A4B; --trash:#F26262; --trash-dark:#BE3D3D;
    --maybe:#8A9AA8; --maybe-dark:#5F6F7D;
    --on-accent:#0B2E18; --on-h:#0F1613;
    --gold:#F5C24D; --silver:#BCC5CE; --bronze:#D9A06B;
    --shadow-card:0 25px 50px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
    --shadow-soft:0 4px 14px -2px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--wrap);color:var(--ink);font-family:var(--font);font-weight:500;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;color:inherit;font-weight:inherit}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
  .ic{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.12em}
  .num{font-variant-numeric:tabular-nums;font-weight:800}

  .shell{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;
    background:var(--ground);position:relative;overflow:hidden}
  @media (min-width:560px){
    body{padding:22px 16px}
    .shell{height:calc(100dvh - 44px);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow-card)}
  }

  .press{--edge:var(--accent-dark);border:0;cursor:pointer;position:relative;
    box-shadow:0 5px 0 var(--edge);transform:translateY(0);transition:transform .06s,box-shadow .06s}
  .press:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge)}
  .press:disabled{cursor:default;transform:none}

  /* ---- topbar ---- */
  .topbar{flex:0 0 auto;padding:14px 16px 12px;background:var(--ground);z-index:5}
  .topbar__row{display:flex;align-items:center;gap:8px}
  .wordmark{font-weight:900;font-size:17px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;flex:1;min-width:0;color:var(--ink)}
  .wordmark em{font-style:normal;color:var(--green)}
  .wordmark .ic{color:var(--green);font-size:18px;stroke-width:2.2}
  .iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:0;
    background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:18px}
  .iconbtn .ic{stroke-width:2.2}
  .iconbtn:hover{background:var(--green-soft);color:var(--green-ink)}

  .statrow{display:flex;align-items:center;gap:8px;margin-top:12px}
  .pchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;
    background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);max-width:46%}
  .pchip .av{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--green);
    color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
  .pchip .car{color:var(--ink-faint);font-size:10px}
  .sticker{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-weight:800;font-size:12.5px;
    background:var(--salmon-soft);color:var(--salmon);transform:rotate(-3deg)}
  .sticker .ic{stroke-width:2.4}
  .sticker.dead{background:var(--surface-2);color:var(--ink-faint)}
  .xp{flex:1;min-width:0}
  .xp__meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:4px}
  .xp__meta b{color:var(--ink)}
  .xp__bar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,var(--surface));overflow:hidden}
  .xp__fill{height:100%;min-width:12px;border-radius:999px;background:var(--green);transition:width .45s cubic-bezier(.2,.8,.2,1);
    background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.25))}

  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .dock{flex:0 0 auto;padding:12px 16px 18px;display:flex;gap:10px;
    background:linear-gradient(to top,var(--ground) 70%,transparent)}

  .demobanner{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 16px 0;
    padding:9px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--green-ink);background:var(--green-soft)}
  .demobanner button{background:none;border:0;color:var(--green-ink);font-weight:800;font-size:12px;cursor:pointer;padding:0;white-space:nowrap;text-decoration:underline}

  .loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 20px;color:var(--ink-faint);font-weight:700}
  .loading .ic{font-size:36px;color:var(--green);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.92)}}
  .errorbox{margin:24px 16px;padding:18px;border-radius:20px;background:var(--salmon-soft);color:var(--ink)}
  .errorbox h3{margin:0 0 6px;font-weight:900;font-size:18px}
  .errorbox p{margin:0 0 8px;font-size:13.5px;font-weight:600;word-break:break-word}
  .errorbox .sub{color:var(--ink-soft);font-weight:500}

  /* ---- card stage ---- */
  .stage{position:relative;display:grid;place-items:center;padding:20px 16px 4px;min-height:372px;isolation:isolate}
  .blob{position:absolute;width:min(380px,92vw);height:300px;top:24px;left:50%;transform:translateX(-50%) rotate(-6deg);
    background:var(--green-soft);border-radius:63% 37% 54% 46% / 55% 48% 52% 45%;z-index:-1}
  .blob::after{content:"";position:absolute;right:-18px;bottom:-14px;width:110px;height:110px;background:var(--salmon-soft);
    border-radius:44% 56% 62% 38% / 52% 41% 59% 48%;transform:rotate(18deg)}
  .cardstack{position:relative;width:min(344px,80vw);height:344px}
  .card{position:absolute;inset:0;background:var(--surface);border-radius:28px;
    box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column}
  .card--top{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform}
  .card--top:active{cursor:grabbing}
  .card--behind{transform:scale(.94) translateY(18px);pointer-events:none;opacity:.85}
  .card__photo{flex:1;position:relative;display:grid;place-items:center;color:var(--green);min-height:120px;
    background:linear-gradient(160deg,var(--green-soft),color-mix(in srgb,var(--green-soft) 50%,var(--surface)))}
  .card__photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bigic{font-size:84px;line-height:1;opacity:.5}
  .bigic .ic{stroke-width:1.4}
  .price{position:absolute;left:14px;bottom:12px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--ground);
    font-weight:800;font-size:13px;transform:rotate(-2deg);box-shadow:0 4px 12px rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:6px}
  .price .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
  .card__body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
  .card__name{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
    color:var(--ink-soft);font-weight:700;font-size:11px}
  .advice{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.35}

  .stamp{position:absolute;top:18px;padding:5px 12px;border:4px solid;border-radius:12px;
    font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .1s;background:var(--surface)}
  .stamp[data-dir="keep"]{left:16px;transform:rotate(-11deg);color:var(--keep);border-color:var(--keep)}
  .stamp[data-dir="sell"]{right:16px;transform:rotate(11deg);color:var(--sell);border-color:var(--sell)}
  .stamp[data-dir="trash"]{left:16px;top:96px;transform:rotate(-9deg);color:var(--trash);border-color:var(--trash)}
  .stamp[data-dir="donate"]{right:16px;top:96px;transform:rotate(9deg);color:var(--donate);border-color:var(--donate)}
  .hint{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-faint);padding:0 8px}

  /* ---- decisions ---- */
  .decisions{width:min(344px,80vw);margin:32px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dbtn{--h:var(--keep);--edge:var(--keep-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:12px 8px 11px;min-height:66px;border-radius:20px;font-weight:800;font-size:15px;letter-spacing:-.01em;
    background:var(--h);color:var(--on-h)}
  .dbtn .ic{font-size:20px;stroke-width:2.4;margin-bottom:2px}
  .dbtn small{font-weight:700;font-size:10.5px;opacity:.85}
  .subrow{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .linkbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
    border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer}
  .linkbtn:hover{border-color:var(--green);color:var(--green-ink)}
  .linkbtn .ic{font-size:14px;stroke-width:2.2}

  /* ---- piles / board ---- */
  .sec{padding:22px 16px 0}
  .sec h2{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:0 0 10px}
  .pilerow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pile{--h:var(--keep);display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 6px 10px;
    border-radius:20px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:center}
  .pile:hover{border-color:var(--h)}
  .pile b{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--h);color:var(--on-h);
    font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .pile span{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .yearbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:12px 16px;
    border-radius:20px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:left}
  .yearbox.warn{background:var(--salmon-soft);border-color:transparent}
  .yearbox .t{font-size:13px;font-weight:800;display:block}
  .yearbox .s{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
  .yearbox.warn .s{color:var(--salmon)}
  .yearbox .go{width:30px;height:30px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);font-weight:800;flex:0 0 auto}
  .yearbox.warn .go{background:var(--salmon);color:#fff}

  .board{display:flex;flex-direction:column;gap:8px}
  .brow{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
  .brow .av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
  .brow .nm{flex:1;font-weight:800;font-size:14px;min-width:0;display:flex;flex-direction:column;gap:1px}
  .brow .live{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--green-ink)}
  .brow .live .ic{color:var(--green);stroke-width:2.4}
  .brow .fl{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--salmon)}
  .brow.me{border-color:var(--green)}
  .brow .xpv{font-weight:800;font-size:13px;color:var(--green-ink);background:var(--green-soft);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}

  .emptystate{text-align:center;padding:44px 24px 12px;color:var(--ink-soft)}
  .emptystate .big{width:84px;height:84px;margin:0 auto;border-radius:999px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;
    box-shadow:0 6px 0 var(--green-dark)}
  .emptystate .big .ic{stroke-width:2.6}
  .emptystate h3{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:18px 0 6px;color:var(--ink)}
  .emptystate p{font-size:13.5px;font-weight:600;margin:0}

  .btn{border:0;border-radius:999px;padding:15px 18px;font-weight:800;font-size:16px;letter-spacing:-.01em;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn--primary{background:var(--ink);color:var(--ground);flex:1;--edge:#000}
  .btn--ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink);padding-top:13px;padding-bottom:13px}
  .btn--accent{background:var(--green);color:var(--on-accent);flex:1;--edge:var(--green-dark)}
  .btn .ic{font-size:18px;stroke-width:2.4}
  .btn--round{width:54px;height:54px;padding:0;border-radius:999px;flex:0 0 auto}

  .sprintbar{flex:1;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:999px;background:var(--green);color:var(--on-accent);
    box-shadow:0 5px 0 var(--green-dark)}
  .sprintbar .ic{font-size:20px;stroke-width:2.4}
  .sprintbar .clock{font-weight:900;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sprintbar .z{flex:1;min-width:0;font-size:12px;font-weight:700;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sprintbar button{background:color-mix(in srgb,var(--on-accent) 16%,transparent);border:2px solid color-mix(in srgb,var(--on-accent) 45%,transparent);
    color:var(--on-accent);border-radius:999px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer}

  /* ---- sheets ---- */
  .overlay{position:fixed;inset:0;background:rgba(10,16,13,.5);display:flex;align-items:flex-end;justify-content:center;
    z-index:40;padding:0;animation:fade .18s ease}
  @media (min-width:560px){.overlay{align-items:center;padding:20px}}
  @keyframes fade{from{opacity:0}}
  .sheet{width:min(468px,100%);max-height:88dvh;overflow-y:auto;background:var(--surface);
    border-radius:30px 30px 0 0;padding:14px 18px 24px;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:560px){.sheet{border-radius:28px}}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}}
  .sheet__grip{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
  .sheet h3{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
  .sheet .sub{color:var(--ink-soft);font-size:13px;font-weight:600;margin:0 0 16px;line-height:1.4}
  .field{margin-bottom:14px}
  .field>label{display:block;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:7px}
  .input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);
    color:var(--ink);font-size:15px;font-weight:600;font-family:var(--font)}
  .input::placeholder{color:var(--ink-faint);font-weight:500}
  .input:focus{outline:0;border-color:var(--green)}
  .input--code{text-transform:uppercase;letter-spacing:.3em;font-weight:900;font-size:22px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:var(--surface);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--green);color:var(--on-accent);border-color:var(--green)}
  .chip .ic{font-size:14px;stroke-width:2.2}
  .segment{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--surface-2);border-radius:999px}
  .seg{padding:9px 6px;border:0;border-radius:999px;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer}
  .seg[aria-pressed="true"]{background:var(--surface);color:var(--green-ink);box-shadow:var(--shadow-soft)}
  .photopick{height:140px;border:2px dashed color-mix(in srgb,var(--green) 40%,transparent);border-radius:20px;display:grid;place-items:center;
    cursor:pointer;overflow:hidden;position:relative;text-align:center;font-size:13px;font-weight:700;gap:4px;background:var(--green-soft);color:var(--green-ink)}
  .photopick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photopick .ic{font-size:26px;stroke-width:2}
  .ai-veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(10,16,13,.58);color:#fff;font-weight:800;font-size:14px}
  .ai-veil .ic{font-size:20px;stroke-width:2.2;color:#fff}
  .spin{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ai-note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green-ink)}
  .ai-note .ic,.ai-tag .ic{color:var(--green);stroke-width:2.2}
  .ai-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--green-ink);margin-left:4px}
  .price .ic{font-size:12px;stroke-width:2.4;color:var(--gold)}
  .sheet__actions{display:flex;gap:10px;margin-top:8px}
  .sheet__actions .btn{flex:1;font-size:15px;padding:14px}
  .codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 18px;border-radius:20px;background:var(--green-soft)}
  .codebox .code{font-weight:900;font-size:28px;letter-spacing:.22em;color:var(--green-ink)}
  .codebox .btn{padding:10px 14px;font-size:13px}
  .mode{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);font-size:12px;font-weight:800}
  .mode.on{background:var(--green-soft);color:var(--green-ink)}

  .list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .li{display:flex;align-items:center;gap:12px;padding:10px;border:2px solid var(--line);border-radius:20px;background:var(--surface)}
  .li__ph{width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;
    flex:0 0 auto;color:var(--green);font-size:20px;overflow:hidden}
  .li__ph .ic{stroke-width:2}
  .li__ph img{width:100%;height:100%;object-fit:cover}
  .li__t{flex:1;min-width:0}
  .li__t--edit{cursor:pointer;border-radius:10px;margin:-4px;padding:4px}
  .li__t--edit:hover{background:var(--surface-2)}
  .pricerow{display:flex;align-items:center;gap:8px}
  .pricerow .input{text-align:center;font-variant-numeric:tabular-nums;padding-left:8px;padding-right:8px}
  .pricerow .sep{font-weight:800;color:var(--ink-faint)}
  .pricerow .unit{font-weight:800;color:var(--ink-soft);white-space:nowrap}
  .pricerow .reset{background:var(--surface-2);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
  .pricerow .reset .ic{stroke-width:2.2}
  .btn--danger{background:color-mix(in srgb,var(--trash) 12%,var(--surface));color:var(--trash);border:0}
  .li__n{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li__s{font-size:11.5px;font-weight:600;color:var(--ink-faint)}
  .li__b{background:var(--surface-2);border:0;border-radius:999px;padding:7px 11px;font-size:12px;
    font-weight:800;cursor:pointer;color:var(--ink);white-space:nowrap}
  .li__b:hover{background:var(--green-soft);color:var(--green-ink)}
  .li .num{font-size:18px;color:var(--ink)}
  .empty-note{color:var(--ink-faint);font-size:13px;font-weight:600;text-align:center;padding:16px 0}
  .settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);font-size:13.5px;font-weight:700}
  .settings-row:last-child{border-bottom:0}
  .settings-row button{background:var(--surface-2);border:0;border-radius:999px;padding:8px 13px;
    font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
  .settings-row button:disabled{opacity:.4;cursor:default}
  .settings-row button.danger{color:var(--trash);background:color-mix(in srgb,var(--trash) 12%,var(--surface))}

  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;animation:rise .2s ease}
  .toast button{background:none;border:0;color:var(--green);font-weight:800;cursor:pointer;font-size:13px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  :focus-visible{outline:3px solid var(--green);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<div class="shell">
  <div class="topbar" id="topbar"></div>
  <div class="scroll" id="scroll"></div>
  <div class="dock" id="dock"></div>
</div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
